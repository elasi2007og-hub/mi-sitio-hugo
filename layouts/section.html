{{ partial "header.html" . }}
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    <ul class="post-list">
    {{ range .RegularPages }}
        <li class="post-item">
            {{ if .Date }}<span class="post-meta">📅 {{ .Date | time.Format ":date_long" }}</span>{{ end }}
            <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
            <p>{{ .Summary | plainify }}... <a href="{{ .RelPermalink }}">Leer entrada completa →</a></p>
        </li>
    {{ end }}
    </ul>
{{ partial "footer.html" . }}
